# build.yml — HPCM_ADMIN component build workflow.
apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: build

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        default: 2.9.0
        description: Version to build and register
  workflow_call:
    inputs:
      version:
        type: string
        default: 2.9.0
    outputs:
      artifact-id:
        value: ${{ jobs.build.outputs.artifact-id }}
      version:
        value: ${{ jobs.build.outputs.version }}
  push:
    branches:
      - main

jobs:
  build:
    outputs:
      artifact-id: hpcm-admin-artifact-${{ cloudbees.version }}
      version: ${{ inputs.version }}
    steps:
      - name: Check out repository
        uses: cloudbees-io/checkout@v2

      - name: Build HPCM_ADMIN
        uses: docker://bash:5.2
        shell: sh
        run: |
          bash build.sh "${{ inputs.version }}"

      - name: Register build artifact
        uses: cloudbees-io/register-build-artifacts@main
        with:
          artifact-metadata: |
            [
              {
                "name": "hpcm-admin",
                "version": "${{ inputs.version }}",
                "url": "https://artifactory.example.internal/hpe-releases/hpcm-admin/${{ inputs.version }}/hpcm-admin.tar.gz",
                "type": "generic"
              }
            ]
